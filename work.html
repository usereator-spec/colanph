<!DOCTYPE html>
<html data-theme="white" lang="it">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="robots" content="index,follow" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=New+Amsterdam&family=Source+Code+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="./assets/css/style.css" rel="stylesheet" />
  <title>Works — ColanPh</title>
</head>
<body class="page-work-detail" data-content-page="work">
  <nav class="site-nav project-site-nav" id="nav">
    <a class="nav-logo" href="./index.html">ColanPh</a>
    <div class="nav-actions">
      <button aria-label="Passa all'inglese" class="nav-action language-toggle" id="language-toggle" type="button"><span id="language-toggle-label">EN</span></button>
      <button aria-label="Cambia tema" class="nav-action theme-toggle" id="theme-toggle" type="button"><span id="theme-toggle-label">BIANCO</span></button>
    </div>
    <button aria-expanded="false" aria-label="Menu" class="nav-hamburger" data-i18n-aria-label="nav.menu" id="nav-hamburger" type="button">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a data-i18n="nav.home" href="./index.html">Home</a></li>
      <li><a aria-current="page" data-i18n="nav.works" href="./works.html">Works</a></li>
      <li><a data-i18n="nav.about" href="./about.html">About</a></li>
    </ul>
  </nav>

  <main class="project-page-main" id="work-detail" hidden>
    <section class="project-info project-info-top">
      <p class="project-info-desc" id="work-description"></p>
    </section>
    <section class="project-gallery-section">
      <div class="img-grid project-horizontal-gallery" id="work-gallery"></div>
    </section>
    <div aria-label="Navigazione tra sezioni e progetti" class="project-pagination" data-i18n-aria-label="project.navigation" id="work-pagination"></div>
  </main>
  <main class="project-page-main project-not-found" id="work-not-found" hidden>
    <p>Contenuto non trovato.</p>
    <a href="./works.html">Works</a>
  </main>

  <div aria-label="Visualizzatore immagine" aria-modal="true" class="lightbox" data-i18n-aria-label="lightbox.viewer" id="lightbox" role="dialog">
    <button aria-label="Chiudi" class="lb-close" data-i18n-aria-label="lightbox.close" id="lb-close">×</button>
    <button aria-label="Immagine precedente" class="lb-nav lb-prev" data-i18n-aria-label="lightbox.previous" id="lb-prev">‹</button>
    <img alt="Immagine ingrandita" data-i18n-alt="lightbox.enlarged" id="lb-img" src="" />
    <button aria-label="Immagine successiva" class="lb-nav lb-next" data-i18n-aria-label="lightbox.next" id="lb-next">›</button>
    <span class="lb-count" id="lb-count"></span>
  </div>

  <script src="./assets/js/cloudinary.js"></script>
  <script src="./assets/js/translations.js"></script>
  <script src="./assets/js/site-content.js"></script>
  <script src="./assets/js/main.js"></script>
</body>
</html>
